[package]
name = "filelist-cinema"
version = "2.0.0"
edition = "2021"
rust-version = "1.99"
description = "Browse FileList movies, download them with qBittorrent, and stream them to any browser"
publish = false

[[bin]]
name = "FileListCinema"
path = "src/main.rs"

# Exact versions, each at least two weeks old when chosen. Only pure-Rust crates: the GNU toolchain
# builds this without a C compiler, and HTTPS uses Windows' own TLS (SChannel) via native-tls.
[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "form"] }
bytes = "=1.12.1"
encoding_rs = "=0.8.42"
futures-util = "=0.3.34"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "cookies", "multipart", "stream", "charset", "form", "query"] }
scraper = "=0.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.11.0"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "time", "sync", "signal"] }
tokio-util = { version = "=0.7.19", features = ["io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
